version: '3.8'

services:
  app:
    image: ${DOCKER_IMAGE:-firewatch03:latest}
    ports:
      - "8080:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=${SPRING_PROFILES_ACTIVE:-dev}
      - SPRING_DATASOURCE_URL=jdbc:oracle:thin:@db:1521:ORCLCDB
      - SPRING_DATASOURCE_USERNAME=firewatch
      - SPRING_DATASOURCE_PASSWORD=${DB_PASSWORD:-password}
    depends_on:
      - db
    restart: always
    networks:
      - firewatch-network

  db:
    image: gvenzl/oracle-xe:21-slim
    environment:
      - ORACLE_PASSWORD=${DB_PASSWORD:-password}
      - ORACLE_DATABASE=ORCLCDB
    volumes:
      - oracle-data:/opt/oracle/oradata
    ports:
      - "1521:1521"
    networks:
      - firewatch-network

networks:
  firewatch-network:
    driver: bridge

volumes:
  oracle-data: