version: '3.8'

services:
  app:
    build: .
    ports:
      - "8080:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=dev
    depends_on:
      - db
    networks:
      - firewatch-network

  db:
    image: gvenzl/oracle-xe:21-slim
    environment:
      - ORACLE_PASSWORD=password
      - ORACLE_DATABASE=ORCLCDB
    volumes:
      - oracle-data:/opt/oracle/oradata
    ports:
      - "1521:1521"
    networks:
      - firewatch-network

networks:
  firewatch-network:
    driver: bridge

volumes:
  oracle-data: