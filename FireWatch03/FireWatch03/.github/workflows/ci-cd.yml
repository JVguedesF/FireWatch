name: FireWatch03 CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  build:
    name: Build and Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Set up JDK 21
        uses: actions/setup-java@v3
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Build with Maven
        run: mvn -B clean package

      - name: Run Tests
        run: mvn test

      - name: Check for vulnerabilities
        run: mvn org.owasp:dependency-check-maven:check

      - name: Build Docker Image
        run: docker build -t firewatch03:${{ github.sha }} .

      - name: Save Docker image
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop'
        run: docker save firewatch03:${{ github.sha }} > firewatch03.tar

      - name: Upload Docker image as artifact
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop'
        uses: actions/upload-artifact@v3
        with:
          name: docker-image
          path: firewatch03.tar

  deploy-staging:
    name: Deploy to Staging
    needs: build
    if: github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@v3

      - name: Download Docker image
        uses: actions/download-artifact@v3
        with:
          name: docker-image

      - name: Load Docker image
        run: docker load < firewatch03.tar

      - name: Deploy to Staging Server
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.STAGING_HOST }}
          username: ${{ secrets.STAGING_USER }}
          key: ${{ secrets.STAGING_SSH_KEY }}
          script: |
            # Criar diretório se não existir
            mkdir -p ~/firewatch03
            
            # Criar arquivo .env com as variáveis de ambiente
            cat > ~/firewatch03/.env << EOF
            DOCKER_IMAGE=firewatch03:${{ github.sha }}
            DB_PASSWORD=${{ secrets.DB_PASSWORD_STAGING }}
            JWT_SECRET=${{ secrets.JWT_SECRET_STAGING }}
            GRAFANA_PASSWORD=${{ secrets.GRAFANA_PASSWORD_STAGING }}
            EOF
            
            # Copiar arquivos docker-compose e configurações
            scp -r docker-compose.staging.yml monitoring ~/firewatch03/
            
            # Aplicar as mudanças
            cd ~/firewatch03
            docker-compose -f docker-compose.staging.yml down
            docker-compose -f docker-compose.staging.yml up -d

      - name: Verify Staging Deployment
        run: |
          # Aguardar a aplicação iniciar
          sleep 30
          # Verificar se a aplicação está respondendo
          curl -f http://${{ secrets.STAGING_HOST }}:8080/actuator/health || exit 1

  deploy-production:
    name: Deploy to Production
    needs: [build, deploy-staging]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v3

      - name: Download Docker image
        uses: actions/download-artifact@v3
        with:
          name: docker-image

      - name: Load Docker image
        run: docker load < firewatch03.tar

      - name: Deploy to Production Server
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.PRODUCTION_HOST }}
          username: ${{ secrets.PRODUCTION_USER }}
          key: ${{ secrets.PRODUCTION_SSH_KEY }}
          script: |
            # Criar diretório se não existir
            mkdir -p ~/firewatch03
            
            # Criar arquivo .env com as variáveis de ambiente
            cat > ~/firewatch03/.env << EOF
            DOCKER_IMAGE=firewatch03:${{ github.sha }}
            DB_PASSWORD=${{ secrets.DB_PASSWORD_PROD }}
            JWT_SECRET=${{ secrets.JWT_SECRET_PROD }}
            GRAFANA_PASSWORD=${{ secrets.GRAFANA_PASSWORD_PROD }}
            EOF
            
            # Copiar arquivos docker-compose e configurações
            scp -r docker-compose.prod.yml monitoring ~/firewatch03/
            
            # Aplicar as mudanças
            cd ~/firewatch03
            docker-compose -f docker-compose.prod.yml down
            docker-compose -f docker-compose.prod.yml up -d

      - name: Verify Production Deployment
        run: |
          # Aguardar a aplicação iniciar
          sleep 30
          # Verificar se a aplicação está respondendo
          curl -f http://${{ secrets.PRODUCTION_HOST }}:8080/actuator/health || exit 1